name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Existing migrations require both pg_trgm and pgvector.
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-password@localhost:5432/ci

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - name: Apply migrations to clean PostgreSQL
        run: npm run db:deploy
      - name: Prisma database smoke test
        run: >-
          node -e 'const { PrismaClient } = require("@prisma/client"); const db = new PrismaClient();
          db.$queryRawUnsafe("SELECT 1").then(() => console.log("Prisma DB smoke test passed"))
          .finally(() => db.$disconnect())'
      - name: Lint
        run: npm run lint
      - name: Application typecheck
        run: npm run typecheck
      - name: Test typecheck
        run: npm run typecheck:test
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Audit production high vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Audit migrations
        if: github.event_name == 'pull_request'
        run: npm run migrate:audit -- --base="origin/${{ github.base_ref }}"
